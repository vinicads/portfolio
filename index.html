<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de Vinicius Augusto dos Santos, desenvolvedor full stack focado em sistemas web, interfaces responsivas e produtos digitais profissionais.">
    <meta name="theme-color" content="#f7f6f1">
    <title>Vinicius Augusto dos Santos | Desenvolvedor Full Stack</title>
    <script>
        (() => {
            const fallbackTheme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
            let theme = fallbackTheme;

            try {
                const savedTheme = localStorage.getItem("portfolio-theme");
                if (savedTheme === "dark" || savedTheme === "light") theme = savedTheme;
            } catch (error) {
                theme = fallbackTheme;
            }

            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;

            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute("content", theme === "dark" ? "#080808" : "#f8f8f9");
        })();
    </script>
    <link rel="preload" href="./assets/images/optimized/encontrando-fretes-cover.jpg" as="image">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/png" href="./assets/icons/iconSite.png">
</head>
<body>
    <a class="skip-link" href="#main">Ir para o conteúdo</a>
    <div class="page-progress" aria-hidden="true" data-scroll-progress></div>
    <div class="cursor-dot" aria-hidden="true" data-cursor-dot></div>
    <div class="cursor-ring" aria-hidden="true" data-cursor-ring></div>

    <header class="site-header" data-header>
        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="siteMenu" aria-expanded="false" data-menu-toggle>
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-shell" aria-label="Principal">
            <a class="brand" href="#hero" aria-label="Vinicius Augusto dos Santos">
                <span class="brand-mark">VA</span>
                <span>Vinicius Augusto</span>
            </a>

            <div class="nav-panel" id="siteMenu" data-menu>
                <a href="#about" data-nav="about">Sobre</a>
                <a href="#experience" data-nav="experience">Experiência</a>
                <a href="#stack" data-nav="stack">Stack</a>
                <a href="#projects" data-nav="projects">Projetos</a>
                <a href="#contact" data-nav="contact">Contato</a>
                <button class="theme-button icon-button" type="button" data-theme-toggle aria-label="Alternar tema">
                    <span data-theme-icon data-icon="moon" aria-hidden="true"></span>
                </button>
                <button class="lang-button" type="button" data-lang-toggle aria-label="Change language">
                    <span data-current-lang>PT</span>
                </button>
                <a class="nav-cta" href="#contact" data-copy="navCta"></a>
            </div>

            <button class="lang-button header-lang-button" type="button" data-lang-toggle aria-label="Change language">
                <span data-current-lang>PT</span>
            </button>
        </nav>
    </header>

    <a class="floating-cta" data-whatsapp-link target="_blank" rel="noopener" data-copy="floatingCta" aria-label="Chamar no WhatsApp"></a>

    <main id="main">
        <section class="hero" id="hero">
            <div class="hero-copy reveal" data-parallax data-parallax-speed="-0.08">
                <div class="hero-control-row">
                    <p class="section-kicker" data-copy="hero.eyebrow"></p>
                </div>
                <h1 data-hero-title></h1>
                <p class="hero-role" data-copy="hero.role"></p>
                <p class="hero-lead" data-copy="hero.lead"></p>
                <div class="hero-purpose" data-parallax data-parallax-speed="0.035">
                    <strong data-copy="hero.purposeTitle"></strong>
                    <span data-copy="hero.purposeText"></span>
                </div>
                <ul class="hero-points" aria-label="Destaques">
                    <li><span data-copy="hero.pointOne"></span></li>
                    <li><span data-copy="hero.pointTwo"></span></li>
                    <li><span data-copy="hero.pointThree"></span></li>
                </ul>
                <p class="hero-status" data-copy="hero.availability"></p>
                <div class="hero-actions">
                    <a class="button primary" href="#projects" data-copy="hero.primaryCta"></a>
                    <a class="button secondary" href="#contact" data-copy="hero.secondaryCta"></a>
                    <a class="button ghost" href="#stack" data-copy="hero.tertiaryCta"></a>
                </div>
            </div>

            <aside class="hero-pipeline reveal" data-hero-pipeline data-parallax data-parallax-speed="0.12" aria-label="Fluxo técnico"></aside>

            <div class="hero-footer-line reveal">
                <a href="#impact" data-copy="hero.scrollCta"></a>
                <div class="hero-socials" data-hero-socials></div>
            </div>
        </section>

        <section class="tech-section" aria-label="Tecnologias">
            <div class="tech-list" data-tech-list></div>
        </section>

        <section class="section impact-section" id="impact">
            <div class="section-heading reveal" data-parallax data-parallax-speed="-0.025">
                <p class="section-kicker" data-copy="impact.eyebrow"></p>
                <h2 data-copy="impact.title"></h2>
                <p data-copy="impact.lead"></p>
            </div>
            <dl class="facts-strip reveal" data-stats></dl>
        </section>

        <section class="section paths-section" id="paths">
            <div class="section-heading reveal">
                <p class="section-kicker" data-copy="paths.eyebrow"></p>
                <h2 data-copy="paths.title"></h2>
                <p data-copy="paths.lead"></p>
            </div>
            <div class="path-grid" data-paths></div>
            <div class="cta-strip reveal">
                <div>
                    <strong data-copy="paths.ctaTitle"></strong>
                    <p data-copy="paths.ctaText"></p>
                </div>
                <div class="cta-actions">
                    <a class="button primary" data-whatsapp-link target="_blank" rel="noopener" data-copy="paths.primaryCta"></a>
                    <a class="button soft" href="#projects" data-copy="paths.secondaryCta"></a>
                </div>
            </div>
        </section>

        <section class="section experience-section" id="experience">
            <div class="section-heading reveal">
                <p class="section-kicker" data-copy="experience.eyebrow"></p>
                <h2 data-copy="experience.title"></h2>
                <p data-copy="experience.lead"></p>
            </div>
            <div class="experience-board reveal" data-experience></div>
        </section>

        <section class="section stack-map-section" id="stack">
            <div class="section-heading reveal">
                <p class="section-kicker" data-copy="stack.eyebrow"></p>
                <h2 data-copy="stack.title"></h2>
                <p data-copy="stack.lead"></p>
            </div>
            <div class="stack-map reveal" data-stack-map data-parallax data-parallax-speed="0.028"></div>
        </section>

        <section class="section about-section" id="about">
            <div class="section-heading reveal">
                <p class="section-kicker" data-copy="about.eyebrow"></p>
                <h2 data-copy="about.title"></h2>
            </div>

            <div class="about-layout">
                <article class="about-card panel reveal">
                    <p data-copy="about.paragraphOne"></p>
                    <p data-copy="about.paragraphTwo"></p>
                    <p data-copy="about.paragraphThree"></p>
                </article>

                <div class="skills-area reveal">
                    <h3 data-copy="about.skillsTitle"></h3>
                    <div class="skill-grid" data-skills></div>
                </div>
            </div>

            <div class="education-strip panel reveal">
                <h3 data-copy="about.educationTitle"></h3>
                <div class="timeline" data-education></div>
            </div>

            <div class="philosophy-band reveal" data-parallax data-parallax-speed="-0.032">
                <span data-copy="philosophy.eyebrow"></span>
                <strong data-copy="philosophy.title"></strong>
                <p data-copy="philosophy.lead"></p>
            </div>
        </section>

        <section class="section" id="services">
            <div class="section-heading reveal">
                <p class="section-kicker" data-copy="services.eyebrow"></p>
                <h2 data-copy="services.title"></h2>
                <p data-copy="services.lead"></p>
            </div>
            <div class="services-list" data-services></div>
            <div class="cta-strip reveal">
                <div>
                    <strong data-copy="services.ctaTitle"></strong>
                    <p data-copy="services.ctaText"></p>
                </div>
                <div class="cta-actions">
                    <a class="button primary" data-whatsapp-link target="_blank" rel="noopener" data-copy="services.primaryCta"></a>
                    <a class="button soft" href="#workflow" data-copy="services.secondaryCta"></a>
                </div>
            </div>
        </section>

        <section class="section workflow-section" id="workflow" aria-label="Processo de entrega">
            <div class="workflow-panel reveal" data-parallax data-parallax-speed="0.018">
                <div class="section-heading">
                    <p class="section-kicker" data-copy="workflow.eyebrow"></p>
                    <h2 data-copy="workflow.title"></h2>
                    <p data-copy="workflow.lead"></p>
                </div>
                <div class="workflow-grid" data-workflow></div>
                <div class="section-cta">
                    <p data-copy="workflow.ctaText"></p>
                    <a class="button primary" data-whatsapp-link target="_blank" rel="noopener" data-copy="workflow.cta"></a>
                </div>
            </div>
        </section>

        <section class="section projects-section" id="projects">
            <div class="section-heading reveal">
                <p class="section-kicker" data-copy="projects.eyebrow"></p>
                <h2 data-copy="projects.title"></h2>
                <p data-copy="projects.lead"></p>
            </div>
            <div class="project-toolbar reveal" aria-label="Filtros de projetos" data-project-filters></div>
            <div class="case-list" data-projects></div>
            <div class="cta-strip reveal">
                <div>
                    <strong data-copy="projects.ctaTitle"></strong>
                    <p data-copy="projects.ctaText"></p>
                </div>
                <div class="cta-actions">
                    <a class="button primary" data-whatsapp-link target="_blank" rel="noopener" data-copy="projects.primaryCta"></a>
                    <a class="button soft" href="#services" data-copy="projects.secondaryCta"></a>
                </div>
            </div>
        </section>

        <section class="section contact-section" id="contact">
            <div class="contact-panel panel reveal" data-parallax data-parallax-speed="-0.018">
                <div>
                    <p class="section-kicker" data-copy="contact.eyebrow"></p>
                    <h2 data-copy="contact.title"></h2>
                    <p data-copy="contact.lead"></p>
                    <div class="contact-highlights">
                        <div>
                            <span>01</span>
                            <strong data-copy="contact.highlightOneTitle"></strong>
                            <small data-copy="contact.highlightOneText"></small>
                        </div>
                        <div>
                            <span>02</span>
                            <strong data-copy="contact.highlightTwoTitle"></strong>
                            <small data-copy="contact.highlightTwoText"></small>
                        </div>
                        <div>
                            <span>03</span>
                            <strong data-copy="contact.highlightThreeTitle"></strong>
                            <small data-copy="contact.highlightThreeText"></small>
                        </div>
                    </div>
                </div>
                <div class="contact-side">
                    <form class="contact-form" data-contact-form>
                        <div class="contact-form-head">
                            <strong data-copy="contact.formTitle"></strong>
                            <p data-copy="contact.formLead"></p>
                        </div>
                        <div class="form-grid">
                            <label class="field">
                                <span data-copy="contact.nameLabel"></span>
                                <input type="text" name="name" autocomplete="name" required data-copy-placeholder="contact.namePlaceholder">
                            </label>
                            <label class="field">
                                <span data-copy="contact.emailLabel"></span>
                                <input type="email" name="email" autocomplete="email" required data-copy-placeholder="contact.emailPlaceholder">
                            </label>
                        </div>
                        <label class="field">
                            <span data-copy="contact.projectTypeLabel"></span>
                            <select name="type" required>
                                <option value="" data-copy="contact.projectTypePlaceholder"></option>
                                <option value="Site / landing page" data-copy="contact.typeSite"></option>
                                <option value="Sistema web" data-copy="contact.typeSystem"></option>
                                <option value="WordPress / CMS" data-copy="contact.typeWordPress"></option>
                                <option value="Manutenção / legado" data-copy="contact.typeMaintenance"></option>
                                <option value="Integração / automação" data-copy="contact.typeIntegration"></option>
                            </select>
                        </label>
                        <label class="field">
                            <span data-copy="contact.messageLabel"></span>
                            <textarea name="message" rows="5" required data-copy-placeholder="contact.messagePlaceholder"></textarea>
                        </label>
                        <div class="form-bottom">
                            <small data-copy="contact.formNote"></small>
                            <button class="button primary" type="submit" data-copy="contact.formSubmit"></button>
                        </div>
                    </form>
                    <div class="contact-actions">
                        <a class="button primary" data-whatsapp-link target="_blank" rel="noopener" data-copy="contact.whatsapp"></a>
                        <a class="button secondary" data-resume-link target="_blank" rel="noopener" data-copy="contact.resume"></a>
                    </div>
                    <div class="contact-list" data-contact-list></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <a class="brand" href="#hero" aria-label="Vinicius Augusto dos Santos">
                <span class="brand-mark">VA</span>
                <span>Vinicius Augusto</span>
            </a>
            <p data-copy="footer.tagline"></p>
        </div>
        <div class="footer-links" data-footer-socials></div>
        <p class="copyright" data-footer-copy></p>
    </footer>

    <dialog class="project-dialog" data-project-dialog aria-labelledby="dialogTitle">
        <div class="dialog-shell panel">
            <button class="dialog-close" type="button" aria-label="Fechar projeto" data-dialog-close>×</button>
            <div class="dialog-media">
                <img data-dialog-image alt="" decoding="async">
                <div class="dialog-controls">
                    <button type="button" data-gallery-prev aria-label="Imagem anterior">Anterior</button>
                    <span data-gallery-counter></span>
                    <button type="button" data-gallery-next aria-label="Próxima imagem">Próxima</button>
                </div>
            </div>
            <div class="dialog-content">
                <p class="section-kicker" data-dialog-category></p>
                <h2 id="dialogTitle" data-dialog-title></h2>
                <p data-dialog-description></p>
                <div class="project-tags" data-dialog-tags></div>
                <div class="dialog-links" data-dialog-links></div>
            </div>
        </div>
    </dialog>

    <script src="content.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
